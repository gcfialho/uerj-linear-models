[project]
name = "uerj-linear-models"
version = "1.0.0"
description = "Multiple linear regression from first principles (OLS via QR, inference, diagnostics) on 2020 country data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Fialho" }]
requires-python = ">=3.12"
keywords = ["linear-regression", "ols", "statistics", "numpy", "regression-diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.scripts]
linear-models = "linear_models.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear_models"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "NPY", "PT"]
ignore = [
    "N803", # math-style argument names (X, y) mirror the formulas
    "N806", # math-style local names
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
